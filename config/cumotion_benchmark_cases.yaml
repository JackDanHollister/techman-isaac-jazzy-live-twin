# All values are radians and metres in the TM5S base frame.
# Most pose targets are generated through cuMotion FK from target_joint_positions;
# the named synthetic pin case instead records an explicit flange target.
cases:
  - name: easy_cspace
    mode: cspace
    start_joint_positions: [0.0, 0.0, 1.5708, 0.0, 1.5708, 0.0]
    target_joint_positions: [0.25, -0.30, 1.20, 0.20, 1.30, 0.10]
    expected: success

  - name: flange_pose_orientation
    mode: pose
    start_joint_positions: [0.0, 0.0, 1.5708, 0.0, 1.5708, 0.0]
    target_joint_positions: [0.20, -0.40, 1.35, 0.30, 1.20, -0.50]
    expected: success

  - name: synthetic_pin_790_pregrasp_flange
    mode: pose
    start_joint_positions: [0.0, 0.0, 1.5708, 0.0, 1.5708, 0.0]
    target_pose:
      position_xyz: [0.328932664, -0.055735578, 0.245085387]
      quaternion_xyzw: [0.706850, -0.706745, -0.019039, -0.022619]
    source: play_seed_790 detection 0 pregrasp, approximate 0.16225 m flange-to-TCP correction
    expected: success

  - name: wide_cspace_move
    mode: cspace
    start_joint_positions: [-0.45, -0.35, 1.10, -0.40, 1.25, 0.30]
    target_joint_positions: [0.8718, -0.4293, 2.1296, 0.4353, 1.0920, -0.6501]
    expected: success

  - name: near_joint3_limit_pose
    mode: pose
    start_joint_positions: [0.0, 0.0, 1.5708, 0.0, 1.5708, 0.0]
    target_joint_positions: [0.1767, -0.5548, 2.6736, -0.5611, 1.7295, 0.6053]
    expected: success

  - name: static_obstacle_detour
    mode: cspace
    start_joint_positions: [-0.45, -0.35, 1.10, -0.40, 1.25, 0.30]
    target_joint_positions: [0.8718, -0.4293, 2.1296, 0.4353, 1.0920, -0.6501]
    expected: success
    obstacles:
      - type: cuboid
        position: [0.246469, -0.118321, 0.665250]
        side_lengths: [0.12, 0.18, 0.16]

  - name: target_in_collision_rejection
    mode: cspace
    start_joint_positions: [-0.45, -0.35, 1.10, -0.40, 1.25, 0.30]
    target_joint_positions: [0.8718, -0.4293, 2.1296, 0.4353, 1.0920, -0.6501]
    expected: failure
    obstacles:
      - type: cuboid
        position: [0.322348, 0.057162, 0.317064]
        side_lengths: [0.06, 0.06, 0.06]
